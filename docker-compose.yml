version: '3.8'

services:
  # Database Service (DynamoDB Local)
  kowa-db:
    image: amazon/dynamodb-local:latest
    container_name: kowa-db
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb-data:/data
    networks:
      - kowa-network
    restart: unless-stopped

  # Backend Service (Go API with hot-reload via Air)
  kowa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kowa-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    depends_on:
      - kowa-db
    networks:
      - kowa-network
    restart: unless-stopped

  # Frontend Service (React + Vite)
  kowa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kowa-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    depends_on:
      - kowa-backend
    networks:
      - kowa-network
    restart: unless-stopped

networks:
  kowa-network:
    driver: bridge

volumes:
  dynamodb-data:
    driver: local
  go-build-cache:
    driver: local
